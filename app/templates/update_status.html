{% extends "base.html" %}

{% block content %}

<h2>Update Status</h2>

<form method="POST">

    <select name="status" class="form-control">

        <option value="Pending">Pending</option>

        <option value="In Progress">
            In Progress
        </option>

        <option value="Completed">
            Completed
        </option>

    </select>

    <br>

    <button class="btn btn-primary">
        Update
    </button>

</form>

{% endblock %}
