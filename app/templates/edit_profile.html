{% extends "base.html" %}

{% block content %}

<h2>Edit Profile</h2>

<form method="POST">

    <div class="mb-3">

        <label>Name</label>

        <input
            type="text"
            name="name"
            value="{{ user.name }}"
            class="form-control">

    </div>

    <div class="mb-3">

        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ user.email }}"
            class="form-control">

    </div>

    <div class="mb-3">

        <label>Phone</label>

        <input
            type="text"
            name="phone"
            value="{{ user.phone }}"
            class="form-control">

    </div>

    <button class="btn btn-primary">
        Update Profile
    </button>

</form>

{% endblock %}
