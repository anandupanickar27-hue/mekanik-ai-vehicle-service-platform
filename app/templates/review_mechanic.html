{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card shadow-lg border-0">

            <div class="card-header bg-success text-white">

                <h3 class="mb-0">

                    <i class="bi bi-star-fill"></i>
                    Review Mechanic

                </h3>

                <small>

                    Share your experience with {{ mechanic.name }}

                </small>

            </div>

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <i class="bi bi-person-circle text-primary"
                       style="font-size:5rem;"></i>

                    <h4 class="mt-3">

                        {{ mechanic.name }}

                    </h4>

                    <p class="text-muted">

                        {{ mechanic.mechanic_profile.specialization }}

                    </p>

                </div>

                <form method="POST">

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            <i class="bi bi-star-fill text-warning"></i>
                            Rating

                        </label>

                        <select
                            name="rating"
                            class="form-select"
                            required>

                            <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                            <option value="4">⭐⭐⭐⭐ Very Good</option>
                            <option value="3">⭐⭐⭐ Good</option>
                            <option value="2">⭐⭐ Fair</option>
                            <option value="1">⭐ Poor</option>

                        </select>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            <i class="bi bi-chat-left-text-fill"></i>
                            Your Review

                        </label>

                        <textarea
                            name="comment"
                            class="form-control"
                            rows="5"
                            placeholder="Describe your experience with this mechanic..."
                            required></textarea>

                    </div>

                    <div class="d-flex justify-content-between">

                        <a
                            href="/mechanic/{{ mechanic.id }}"
                            class="btn btn-outline-secondary">

                            <i class="bi bi-arrow-left"></i>
                            Back

                        </a>

                        <button
                            class="btn btn-success">

                            <i class="bi bi-check-circle-fill"></i>
                            Submit Review

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
