{% extends "base.html" %}

{% block content %}

<h2>Mekanik AI Assistant</h2>

<form method="POST">

    <textarea
        name="issue"
        class="form-control"
        rows="5"></textarea>

    <br>

    <button class="btn btn-primary">
        Analyze Issue
    </button>

</form>

{% if response %}

<div class="alert alert-info mt-3">
    {{ response }}
</div>

{% endif %}

{% endblock %}
