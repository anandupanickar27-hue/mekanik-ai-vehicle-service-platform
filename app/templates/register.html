{% extends "base.html" %}

{% block title %}Register | Mekanik{% endblock %}

{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="col-lg-6 col-md-8">

        <div class="card shadow-lg border-0">

            <div class="card-header bg-success text-white text-center py-4">

                <img src="{{ url_for('static', filename='images/mekanik-logo-dark.svg') }}"
                     alt="Mekanik Logo"
                     height="80"
                     class="mb-3">

                <h2 class="mb-1">

                    <i class="bi bi-person-plus-fill"></i>
                    Create Your Account

                </h2>

                <small>
                    Join Mekanik and start managing your vehicle services.
                </small>

            </div>

            <div class="card-body p-4">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            <i class="bi bi-person-fill"></i>
                            Full Name

                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter your full name"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            <i class="bi bi-envelope-fill"></i>
                            Email Address

                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            <i class="bi bi-lock-fill"></i>
                            Password

                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Create a strong password"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            <i class="bi bi-person-badge-fill"></i>
                            Account Type

                        </label>

                        <select
                            name="role"
                            class="form-select">

                            <option value="customer">
                                🚗 Customer
                            </option>

                            <option value="mechanic">
                                👨‍🔧 Mechanic
                            </option>

                        </select>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success w-100">

                        <i class="bi bi-check-circle-fill"></i>
                        Create Account

                    </button>

                </form>

                <hr>

                <p class="text-center mb-0">

                    Already have an account?

                    <a href="{{ url_for('login') }}"
                       class="fw-bold text-decoration-none">

                        Login Here

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
