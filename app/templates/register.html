{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">Register</h2>

            <form method="POST">

                <div class="mb-3">
                    <label>Name</label>
                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label>Account Type</label>
                    <select
                        name="role"
                        class="form-select">

                        <option value="customer">
                            Customer
                        </option>

                        <option value="mechanic">
                            Mechanic
                        </option>

                    </select>
                </div>

                <button
                    type="submit"
                    class="btn btn-success w-100">
                    Register
                </button>

            </form>

            <p class="text-center mt-3">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
