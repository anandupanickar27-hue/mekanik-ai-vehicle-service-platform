{% extends "base.html" %}

{% block content %}

<h2>Welcome, {{ current_user.name }}</h2>

<div class="row">

    <div class="col-md-4 mb-3">
        <div class="card p-3">
            <h4>My Vehicles</h4>
            <h2>{{ my_vehicles }}</h2>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card p-3">
            <h4>My Appointments</h4>
            <h2>{{ my_appointments }}</h2>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card p-3">
            <h4>Pending Services</h4>
            <h2>{{ pending_appointments }}</h2>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card p-3">
            <h4>Completed Services</h4>
            <h2>{{ completed_appointments }}</h2>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<canvas id="statusChart"></canvas>

<script>
const ctx = document.getElementById("statusChart");

new Chart(ctx, {
    type: "pie",
    data: {
        labels: ["Pending", "Completed"],
        datasets: [{
            data: [
                {{ pending_appointments|tojson }},
                {{ completed_appointments|tojson }}
            ]
        }]
    }
});

{% endblock %}
