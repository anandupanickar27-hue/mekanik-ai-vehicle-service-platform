{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-lg border-0">

            <div class="card-header bg-primary text-white">

                <h3 class="mb-0">

                    <i class="bi bi-person-gear"></i>
                    Edit Profile

                </h3>

                <small>
                    Update your personal and professional information.
                </small>

            </div>

            <div class="card-body p-4">

                <form method="POST">

                    <h4 class="mb-4 text-primary">

                        <i class="bi bi-person-circle"></i>
                        User Information

                    </h4>

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            <i class="bi bi-person-fill"></i>
                            Full Name

                        </label>

                        <input
                            type="text"
                            name="name"
                            value="{{ user.name }}"
                            class="form-control"
                            placeholder="Enter your full name"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            <i class="bi bi-envelope-fill"></i>
                            Email Address

                        </label>

                        <input
                            type="email"
                            name="email"
                            value="{{ user.email }}"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            <i class="bi bi-telephone-fill"></i>
                            Phone Number

                        </label>

                        <input
                            type="text"
                            name="user_phone"
                            value="{{ user.phone }}"
                            class="form-control"
                            placeholder="Enter your phone number"
                            required>

                    </div>

                    <hr class="my-4">

                    <h4 class="mb-4 text-success">

                        <i class="bi bi-tools"></i>
                        Mechanic Information

                    </h4>

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            <i class="bi bi-wrench-adjustable-circle-fill"></i>
                            Specialization

                        </label>

                        <select
                            name="specialization"
                            class="form-select">

                            <option value="Brake"
                            {% if profile.specialization == "Brake" %}selected{% endif %}>
                                Brake
                            </option>

                            <option value="Engine"
                            {% if profile.specialization == "Engine" %}selected{% endif %}>
                                Engine
                            </option>

                            <option value="Battery"
                            {% if profile.specialization == "Battery" %}selected{% endif %}>
                                Battery
                            </option>

                            <option value="Tire"
                            {% if profile.specialization == "Tire" %}selected{% endif %}>
                                Tire
                            </option>

                            <option value="General"
                            {% if profile.specialization == "General" %}selected{% endif %}>
                                General Service
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            <i class="bi bi-award-fill"></i>
                            Experience (Years)

                        </label>

                        <input
                            type="number"
                            name="experience"
                            value="{{ profile.experience }}"
                            class="form-control"
                            min="0"
                            placeholder="Years of experience"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            <i class="bi bi-telephone-forward-fill"></i>
                            Work Phone

                        </label>

                        <input
                            type="text"
                            name="mechanic_phone"
                            value="{{ profile.phone }}"
                            class="form-control"
                            placeholder="Workshop contact number">

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            <i class="bi bi-card-text"></i>
                            Professional Bio

                        </label>

                        <textarea
                            name="bio"
                            class="form-control"
                            rows="5"
                            placeholder="Tell customers about your experience, expertise and services...">{{ profile.bio }}</textarea>

                    </div>

                    <div class="d-flex justify-content-between">

                        <a
                            href="/profile"
                            class="btn btn-outline-secondary">

                            <i class="bi bi-arrow-left"></i>
                            Back

                        </a>

                        <button
                            class="btn btn-primary">

                            <i class="bi bi-check-circle-fill"></i>
                            Update Profile

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
