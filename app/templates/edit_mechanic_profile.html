{% extends "base.html" %}

{% block content %}

<h2>Edit Mechanic Profile</h2>

<form method="POST">

    <div class="mb-3">
        <label>Specialization</label>
        <select name="specialization" class="form-select">

            <option value="Brake" {% if profile.specialization == "Brake" %}selected{% endif %}>Brake</option>

            <option value="Engine" {% if profile.specialization == "Engine" %}selected{% endif %}>Engine</option>

            <option value="Battery" {% if profile.specialization == "Battery" %}selected{% endif %}>Battery</option>

            <option value="Tire" {% if profile.specialization == "Tire" %}selected{% endif %}>Tire</option>

            <option value="General" {% if profile.specialization == "General" %}selected{% endif %}>General Service</option>

        </select>
    </div>

    <div class="mb-3">
        <label>Experience</label>
        <input type="number"
               name="experience"
               value="{{ profile.experience }}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Phone</label>
        <input type="text"
               name="phone"
               value="{{ profile.phone }}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Bio</label>
        <textarea name="bio"
                  class="form-control">{{ profile.bio }}</textarea>
    </div>

    <button class="btn btn-primary">
        Update Profile
    </button>

</form>

{% endblock %}
