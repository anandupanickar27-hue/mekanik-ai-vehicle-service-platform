{% extends "base.html" %}

{% block content %}

<h2>Edit Mechanic Profile</h2>

<form method="POST">

    <div class="mb-3">
        <label>Specialization</label>
        <input type="text"
               name="specialization"
               value="{{ profile.specialization }}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Experience</label>
        <input type="number"
               name="experience"
               value="{{ profile.experience }}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Phone</label>
        <input type="text"
               name="phone"
               value="{{ profile.phone }}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Bio</label>
        <textarea name="bio"
                  class="form-control">{{ profile.bio }}</textarea>
    </div>

    <button class="btn btn-primary">
        Update Profile
    </button>

</form>

{% endblock %}
