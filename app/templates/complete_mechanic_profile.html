{% extends "base.html" %}

{% block content %}

<h2>Complete Mechanic Profile</h2>

<form method="POST">

    <div class="mb-3">
        <label>Specialization</label>
        <input type="text"
               name="specialization"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Experience (Years)</label>
        <input type="number"
               name="experience"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Phone</label>
        <input type="text"
               name="phone"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Bio</label>
        <textarea name="bio"
                  class="form-control"></textarea>
    </div>

    <button class="btn btn-primary">
        Save Profile
    </button>

</form>

{% endblock %}
